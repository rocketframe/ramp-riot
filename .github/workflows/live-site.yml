# Publishes the game from main to its live website on Cloudflare Pages: https://rocketframe-ramp-riot.pages.dev
# (it is not served by GitHub Pages). Runs on every merge to main. The hub opens the game there, and reads
# hub-game.json from there. Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Live site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: live-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to Cloudflare Pages
        run: |
          mkdir -p /tmp/site && rsync -a --exclude .git --exclude .github ./ /tmp/site/
          npx --yes wrangler@4.160.0 pages project create rocketframe-ramp-riot --production-branch main 2>/dev/null || true
          npx --yes wrangler@4.160.0 pages deploy /tmp/site --project-name rocketframe-ramp-riot --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Summary
        run: echo "Live: https://rocketframe-ramp-riot.pages.dev (manifest https://rocketframe-ramp-riot.pages.dev/hub-game.json)" >> "$GITHUB_STEP_SUMMARY"
