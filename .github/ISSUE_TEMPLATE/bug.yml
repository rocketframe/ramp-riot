name: Bug
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options: [Live, Staging, Preview, Local]
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone Safari, Windows Chrome
  - type: textarea
    id: notes
    attributes:
      label: Screenshots, console errors, room code
